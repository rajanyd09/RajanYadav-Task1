version: '3.8'

services:
  db:
    image: postgres:15
    container_name: joineazy_db
    environment:
      POSTGRES_USER: joineazy_user
      POSTGRES_PASSWORD: joineazy_password
      POSTGRES_DB: joineazy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: joineazy_server
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://joineazy_user:joineazy_password@db:5432/joineazy?schema=public
      - JWT_SECRET=supersecretjwtkey
    depends_on:
      - db

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: joineazy_client
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  pgdata:
